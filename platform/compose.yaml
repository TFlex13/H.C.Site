services:
  postgres:
    image: postgres:17-alpine
    container_name: highline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: highline
      POSTGRES_PASSWORD: highline_local_only
      POSTGRES_DB: highline
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - highline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U highline -d highline']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  highline_pgdata:
